name: Windows offline installer

on:
  push:
    branches:
      - main
      - windows-offline
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.1'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.17.0'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install Poetry
        run: python -m pip install poetry==2.2.1

      - name: Install dependencies
        shell: pwsh
        run: |
          poetry install --no-interaction
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Set tagged release version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Tag must contain a semantic version such as v0.1.0"
          }
          npm version $version --no-git-tag-version --allow-same-version

      - name: Generate offline course
        shell: pwsh
        env:
          FUTURECODER_LANGUAGE: en
          FUTURECODER_OFFLINE: '1'
        run: |
          poetry run python -m translations.generate_po_file
          poetry run python -m scripts.generate_static_files

      - name: Build offline frontend
        working-directory: frontend
        shell: pwsh
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          NODE_OPTIONS: '--max-old-space-size=4096'
          REACT_APP_DISABLE_FIREBASE: '1'
          REACT_APP_LANGUAGE: en
          REACT_APP_OFFLINE_DESKTOP: '1'
        run: npm run build

      - name: Validate course and desktop server
        shell: pwsh
        run: |
          poetry run python -m scripts.check_offline_build
          if ($LASTEXITCODE -ne 0) { throw 'Offline audit failed' }
          npm test --prefix desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed' }
          poetry run pytest tests/test_linting.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Linting tests failed' }
          poetry run pytest tests/test_steps.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Course tests failed' }

      - name: Build Windows web installer
        working-directory: desktop
        env:
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run pack:win

      - name: Test both packaged applications
        timeout-minutes: 30
        shell: pwsh
        run: ./desktop/test-packaged.ps1

      - name: Upload installer bundle
        uses: actions/upload-artifact@v7
        with:
          name: futurecoder-offline-windows-${{ github.run_id }}
          if-no-files-found: error
          path: |
            desktop/release/nsis-web/
            desktop/release/win7-ia32/*.exe
            desktop/release/win7-ia32/*.blockmap

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: futurecoder-validation-${{ github.run_id }}
          path: desktop/release/*-smoke-result.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer bundle
        uses: actions/download-artifact@v8
        with:
          name: futurecoder-offline-windows-${{ github.run_id }}
          path: release

      - name: Publish GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi
          gh release create "${{ github.ref_name }}" "${assets[@]}" \
            --notes 'Includes the x64 Windows 10/11 web installer and a self-contained 32-bit Windows 7 SP1 installer (win7-ia32). The legacy build uses Electron 22.3.27, which no longer receives security updates. Both packaged applications pass automated course/runtime checks on modern Windows. Actual Windows 7 installation and device validation remain pending.' \
            --generate-notes --title "futurecoder Offline ${{ github.ref_name }}"
